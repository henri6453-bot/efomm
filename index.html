<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EFOMM Study — Plataforma</title>
<style>
:root{--bg:#0b1220;--panel:#111a2d;--panel2:#16223a;--text:#edf3ff;--muted:#94a3b8;--accent:#22c55e;--line:#24324b}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#142033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:flex;min-height:100vh}.side{width:255px;background:var(--bg);color:white;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.logo{font-weight:900;font-size:20px;padding:10px 12px 22px}.logo span{color:#22c55e}.nav button{width:100%;text-align:left;background:none;border:0;color:#c8d3e5;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#16223a;color:#fff}
.main{margin-left:255px;flex:1}.top{height:72px;background:white;border-bottom:1px solid #e5eaf1;display:flex;align-items:center;gap:16px;padding:0 28px;position:sticky;top:0;z-index:5}.search{flex:1;max-width:620px;border:1px solid #dce3ed;border-radius:10px;padding:12px 14px;font-size:14px}.content{padding:28px;max-width:1300px;margin:auto}
.hero{background:linear-gradient(135deg,#101a2e,#193252);color:white;border-radius:18px;padding:28px;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#bdc9da}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:18px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #12213d12}.card h3{margin:0 0 8px}.small{font-size:13px;color:var(--muted)}.bar{height:7px;background:#e8edf3;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;background:var(--accent)}
.module{background:white;border:1px solid #e1e7ef;border-radius:14px;margin:12px 0;overflow:hidden}.moduleHead{padding:17px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.moduleHead h3{margin:0;font-size:16px}.lessons{display:none;border-top:1px solid #e8edf3}.lessons.open{display:block}.lesson{display:flex;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid #eef2f6;cursor:pointer}.lesson:last-child{border:0}.play{width:36px;height:36px;border-radius:50%;border:0;background:#eaf8ef;color:#15803d;font-weight:800}.lesson.done .title{text-decoration:line-through;color:#6b7280}.check{margin-left:auto}.player{background:#07101d;border-radius:16px;overflow:hidden;color:white}.player video{width:100%;max-height:65vh;display:block;background:#000}.playerInfo{padding:18px}.playerInfo h2{margin:0 0 8px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#22c55e;color:#052e16}.ghost{background:#edf2f7;color:#263449}.back{margin-bottom:16px;color:#475569;cursor:pointer}
.empty{padding:40px;text-align:center;color:#64748b;background:white;border:1px dashed #cbd5e1;border-radius:14px}
@media(max-width:800px){.side{width:72px;padding:14px 8px}.logo{font-size:0}.logo:after{content:"E";font-size:22px}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:22px}.main{margin-left:72px}.top{padding:0 14px}.content{padding:18px}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo">EFOMM <span>STUDY</span></div><div class="nav" id="nav"></div></aside>
<main class="main"><header class="top"><input id="search" class="search" placeholder="Buscar aula, assunto ou matéria..."><div id="progressTop" class="small"></div></header><section class="content" id="view"></section></main>
</div>
<script>
const catalog={"Matemática I": [["Lógica proposicional", ["Lógica proposicional (parte 1/2)", "Lógica proposicional (parte 2/2)"]], ["Teoria Elementar dos Conjuntos", ["Teoria Elementar dos Conjuntos"]], ["Álgebra Elementar", ["Álgebra Elementar (parte 1/2)", "Álgebra Elementar (parte 2/2)"]], ["Introdução às funções", ["Introdução às funções (parte 1/2)", "Introdução às funções (parte 2/2)"]], ["Funções quadráticas", ["Funções quadráticas"]], ["Funções exponenciais", ["Funções exponenciais (parte 1/2)", "Funções exponenciais (parte 2/2)"]], ["Funções logarítmicas", ["Funções logarítmicas (parte 1/2)", "Funções logarítmicas (parte 2/2)"]], ["Números complexos", ["Números complexos (parte 1/3)", "Números complexos (parte 2/3)", "Números complexos (parte 3/3)"]]], "Matemática II": [["Trigonometria I", ["Trigonometria I (parte 1/2)", "Trigonometria I (parte 2/2)"]], ["Trigonometria II", ["Trigonometria II (parte 1/2)", "Trigonometria II (parte 2/2)"]], ["Matrizes", ["Matrizes (parte 1/2)", "Matrizes (parte 2/2)"]], ["Determinantes", ["Determinantes (parte 1/2)"]], ["Análise combinatória", ["Análise combinatória (parte 2/3)", "Análise combinatória (parte 3/3)"]], ["Binômio de Newton", ["Binômio de Newton (parte 1/2)", "Binômio de Newton (parte 2/2)"]], ["Probabilidade", ["Probabilidade (parte 1/3)", "Probabilidade (parte 2/3)", "Probabilidade (parte 3/3)"]]], "Matemática III": [["Geometria Plana I", ["Geometria Plana I (parte 2/2)"]], ["Plano Cartesiano", ["Conceitos básicos - Plano Cartesiano"]], ["Geometria Plana II", ["Geometria Plana II (parte 1/2)", "Geometria Plana II (parte 2/2)"]], ["Geometria Plana III", ["Geometria Plana III (parte 1/2)", "Geometria Plana III (parte 2/2)"]], ["Equação da reta", ["Equação da reta"]], ["Geometria Espacial I", ["Geometria Espacial I (parte 1/2)", "Geometria Espacial I (parte 2/2)"]], ["Geometria Espacial II", ["Geometria Espacial II (parte 1/2)", "Geometria Espacial II (parte 2/2)"]]], "Matemática IV": [["Limites", ["Limites (parte 1/2)", "Limites (parte 2/2)"]], ["Derivadas", ["Derivadas (parte 1/2)", "Derivadas (parte 2/2)"]], ["Vetores", ["Vetores (parte 1/2)", "Vetores (parte 2/2)"]], ["Integrais", ["Integrais (parte 1/2)"]]], "Português": [["Fonética e Fonologia", ["Fonética e Fonologia"]], ["Ortografia e acentuação", ["Ortografia e acentuação gráfica"]], ["Formação de palavras", ["Estrutura e elementos que formam as palavras"]], ["Classes de palavras", ["Classes de palavras variáveis - classificação e flexões", "Classes de palavras - Pronomes e verbos"]], ["Classes invariáveis", ["Classes gramaticais invariáveis (parte 1/2)", "Classes gramaticais invariáveis (parte 2/2)"]], ["Sintaxe", ["Sintaxe do período simples (parte 2/3)", "Sintaxe do período simples (parte 3/3)", "Sintaxe do período composto e funções do pronome relativo (parte 1/2)", "Sintaxe do período composto e funções do pronome relativo (parte 2/2)"]], ["Concordância", ["Concordância nominal e verbal (parte 1/2)", "Concordância nominal e verbal (parte 2/2)"]], ["Regência", ["Regência nominal e verbal (parte 1/2)"]], ["Pontuação", ["Sinais de pontuação e Efeitos de sentido por meio da pontuação"]], ["Estilística", ["Estilística - Figuras de linguagem (parte 1/2)", "Estilística - Figuras de linguagem (parte 2/2)"]], ["Tipos e gêneros textuais", ["Tipos e gêneros textuais (parte 1/2)", "Tipos e gêneros textuais (parte 2/2)"]], ["Interpretação de textos", ["Leitura, compreensão, interpretação e análise de textos (parte 1/2)", "Leitura, compreensão, interpretação e análise de textos (parte 2/2)"]], ["Teoria da linguagem", ["Teoria da linguagem"]]], "Inglês": [["Vocabulário", ["Vocabulário (parte 2/2)"]], ["Interpretação de textos", ["Interpretação de textos (parte 1/2)", "Interpretação de textos (parte 2/2)"]], ["Verbos", ["Verbos (parte 1/5)", "Verbos (parte 2/5)", "Verbos (parte 3/5)", "Verbos (parte 4/5)"]], ["Question words", ["Question words (parte 1/2)", "Question words (parte 2/2)"]], ["Articles", ["Articles"]], ["Adjectives", ["Adjectives (parte 1/2)", "Adjectives (parte 2/2)"]], ["Adverbs", ["Adverbs (parte 1/2)"]], ["Prepositions", ["Prepositions (parte 2/3)", "Prepositions (parte 3/3)"]], ["Quantifiers and intensifiers", ["Quantifiers and intensifiers"]]], "Física I": [["Cálculo e vetores", ["Cálculo para física (parte 2/2)", "Vetores"]], ["Produto escalar, vetorial e misto", ["Produto escalar, vetorial e misto (parte 1/2)", "Produto escalar, vetorial e misto (parte 2/2)"]], ["Cinemática", ["Cinemática do movimento retilíneo", "Lançamentos (parte 1/2)", "Lançamentos (parte 2/2)", "Movimentos Circulares (parte 1/2)", "Movimentos Circulares (parte 2/2)", "Cinemática avançada - Noções de cálculo (parte 1/2)", "Cinemática avançada - Noções de cálculo (parte 2/2)"]], ["Dinâmica", ["Dinâmica Linear (parte 1/2)", "Dinâmica Linear (parte 2/2)", "Atrito e resultante centrípeta (parte 1/3)"]], ["Hidrostática", ["Hidrostática (parte 1/2)", "Hidrostática (parte 2/2)"]], ["Hidrodinâmica", ["Hidrodinâmica (parte 1/3)", "Hidrodinâmica (parte 2/3)"]]], "Física II": [["Termologia", ["Termologia"]], ["Termodinâmica", ["Termodinâmica (parte 1/3)", "Termodinâmica (parte 2/3)", "Termodinâmica (parte 3/3)"]], ["Ondulatória", ["Ondulatória - Parte 02 (parte 1/2)", "Ondulatória - Parte 02 (parte 2/2)"]], ["Óptica física", ["Óptica física (parte 1/3)", "Óptica física (parte 2/3)", "Óptica física (parte 3/3)"]]], "Física III": [["Eletrostática I", ["Eletrostática (I) - Força, campos e lei de Gauss (parte 1/3)", "Eletrostática (I) - Força, campos e lei de Gauss (parte 2/3)", "Eletrostática (I) - Força, campos e lei de Gauss (parte 3/3)"]], ["Eletrostática II", ["Eletrostática (II) - Trabalho, potencial e indução (parte 1/3)"]], ["Eletrodinâmica II", ["Eletrodinâmica (II) (parte 1/2)", "Eletrodinâmica (II) (parte 2/2)"]], ["Eletrodinâmica III", ["Eletrodinâmica (III) (parte 1/2)", "Eletrodinâmica (III) (parte 2/2)"]], ["Eletromagnetismo I", ["Eletromagnetismo (I) - Força e campo magnético (parte 1/2)", "Eletromagnetismo (I) - Força e campo magnético (parte 2/2)"]]], "Redação": [["Fundamentos", ["O texto dissertativo-argumentativo", "Texto expositivo x argumentativo", "Tese, recorte temático e tema", "Introdução"]], ["Desenvolvimento", ["Tópico Frasal (parte 1/2)", "Tópico Frasal (parte 2/2)", "Argumentação e Informatividade (parte 1/2)", "Coerência (parte 1/2)", "Coerência (parte 2/2)"]], ["Norma padrão", ["Principais problemas de norma padrão (parte 1/2)", "Principais problemas de norma padrão (parte 2/2)"]], ["Prática", ["Prática (moldes EFOMM)", "Prática de Redação", "Análise de Redações Exemplares"]]]};
const state=JSON.parse(localStorage.getItem("efomm-progress")||"{}");
const view=document.getElementById("view"), nav=document.getElementById("nav"), search=document.getElementById("search");
let currentSubject=null;
const slug=s=>s.normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"").toLowerCase();
function videoPath(subject, module, title){return "videos/"+slug(subject)+"/"+slug(module)+"/"+slug(title)+".mp4"}
function allLessons(){return Object.entries(catalog).flatMap(([s,mods])=>mods.flatMap(([m,ls])=>ls.map(t=>({s,m,t,id:s+"|"+m+"|"+t}))))}
function save(){localStorage.setItem("efomm-progress",JSON.stringify(state)); renderTop()}
function renderTop(){let a=allLessons(),d=a.filter(x=>state[x.id]).length;document.getElementById("progressTop").textContent=`${d}/${a.length} aulas concluídas`}
function navRender(){nav.innerHTML=Object.keys(catalog).map(s=>`<button class="${currentSubject===s?"active":""}" onclick="showSubject(${JSON.stringify(s)})">${s}</button>`).join("")}
function home(){
currentSubject=null;navRender();
let a=allLessons(),d=a.filter(x=>state[x.id]).length;
view.innerHTML=`<div class="hero"><h1>Olá, candidato.</h1><p>Continue sua preparação para a EFOMM. Escolha uma matéria para começar.</p><div class="bar"><div class="fill" style="width:${a.length?d/a.length*100:0}%"></div></div></div><div class="cards">${Object.entries(catalog).map(([s,mods])=>{let ls=mods.flatMap(x=>x[1]);let done=ls.filter(t=>state[s+"|"+mods.find(m=>m[1].includes(t))[0]+"|"+t]).length;return `<div class="card" onclick="showSubject(${JSON.stringify(s)})"><h3>${s}</h3><div class="small">${ls.length} aulas</div><div class="bar"><div class="fill" style="width:${ls.length?done/ls.length*100:0}%"></div></div></div>`}).join("")}</div>`;
}
function showSubject(s){
currentSubject=s;navRender();
view.innerHTML=`<div class="back" onclick="home()">← Início</div><h1>${s}</h1><p class="small">Aulas organizadas por assunto.</p>`+
catalog[s].map(([m,ls],i)=>`<div class="module"><div class="moduleHead" onclick="toggle(${i})"><h3>${m}</h3><span>${ls.length} aulas ▾</span></div><div class="lessons" id="mod${i}">${ls.map(t=>{let id=s+"|"+m+"|"+t;return `<div class="lesson ${state[id]?"done":""}" onclick="openLesson(${JSON.stringify(s)},${JSON.stringify(m)},${JSON.stringify(t)})"><button class="play">▶</button><span class="title">${t}</span><span class="check">${state[id]?"✓":"○"}</span></div>`}).join("")}</div></div>`).join("");
}
function toggle(i){document.getElementById("mod"+i).classList.toggle("open")}
function openLesson(s,m,t){
let id=s+"|"+m+"|"+t, src=videoPath(s,m,t);
view.innerHTML=`<div class="back" onclick="showSubject(${JSON.stringify(s)})">← Voltar para ${s}</div><div class="player"><video controls preload="metadata" src="${src}" onerror="this.dataset.err='1'"></video><div class="playerInfo"><h2>${t}</h2><div class="small">${s} · ${m}</div><div class="actions"><button class="btn primary" onclick="state[${JSON.stringify(id)}]=!state[${JSON.stringify(id)}];save();openLesson(${JSON.stringify(s)},${JSON.stringify(m)},${JSON.stringify(t)})">${state[id]?"✓ Concluída":"Marcar como concluída"}</button><button class="btn ghost" onclick="showSubject(${JSON.stringify(s)})">Lista de aulas</button></div></div></div><div class="empty" style="margin-top:16px">Se o vídeo não carregar, coloque o arquivo em <b>${src}</b> ou altere a URL da aula no catálogo.</div>`;
}
search.addEventListener("input",e=>{
let q=e.target.value.toLowerCase().trim(); if(!q){currentSubject?showSubject(currentSubject):home();return}
let hits=allLessons().filter(x=>(x.s+" "+x.m+" "+x.t).toLowerCase().includes(q));
view.innerHTML=`<div class="back" onclick="home()">← Início</div><h1>Resultados</h1>`+(hits.length?hits.map(x=>`<div class="lesson" onclick="openLesson(${JSON.stringify(x.s)},${JSON.stringify(x.m)},${JSON.stringify(x.t)})"><button class="play">▶</button><span><b>${x.t}</b><br><span class="small">${x.s} · ${x.m}</span></span></div>`).join(""):`<div class="empty">Nenhuma aula encontrada.</div>`);
});
navRender();home();renderTop();
</script></body></html>
